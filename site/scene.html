<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scene harness</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Arena + characters: scene.html?preset=sunset&view=three_quarter&w=1280&h=720&t=0.8
//   cast=assets/models/a.glb,assets/models/b.glb (default: the two fantasy characters), clip=spar|Walk|signature..
//   (stage action, simulated t seconds with spring bones), shading=toon, target=y, dist=, elev=
import { Viewer } from './js/viewer.js';
const q = new URLSearchParams(location.search);
const c = document.getElementById('c');
c.width = +(q.get('w') || 1280); c.height = +(q.get('h') || 720);
c.style.width = c.width + 'px'; c.style.height = c.height + 'px';
const v = new Viewer(c, { preserveDrawingBuffer: true, controls: false });
v.renderer.setPixelRatio(1);
v.resize();
v.setPreset(q.get('preset') || 'sunset');
const cast = (q.get('cast') || 'assets/models/blender/anvil.glb,assets/models/blender/verdant.glb').split(',');
try {
  await v.loadScene({
    arena: '/assets/arena/arena.glb',
    characters: cast.map((url, i) => ({ url: '/' + url, pos: [(i - (cast.length - 1) / 2) * 1.6, 0.07, 0.3], yaw: 0 })),
    target: [0, +(q.get('target') || 1.0), 0], distance: +(q.get('dist') || 7.5), height: +(q.get('elev') || 0.22),
  });
  v.setPreset(q.get('preset') || 'sunset');
  if (q.get('shading')) v.setShading(q.get('shading'));
  v.setView(q.get('view') || 'front');
  if (q.get('clip')) {
    v.playCastClip(q.get('clip'), 0);
    v.seek(+(q.get('t') || 0));
    v.renderOnce(0);
  } else v.renderOnce(+(q.get('t') || 0.5));
  window.__stats = { ok: true };
} catch (e) { window.__error = String(e); }
window.__ready = true;
</script>
</body>
</html>
